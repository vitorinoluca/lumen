[package]
name = "lumen"
version = "0.0.1"
edition = "2021"
build = "build.rs"

[dependencies]
lumen-core = { path = "../core" }
slint = { version = "1", default-features = false, features = ["compat-1-18", "unstable-winit-030", "std", "backend-winit", "renderer-software"] }
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_Controls"] }

[build-dependencies]
slint-build = "1"
